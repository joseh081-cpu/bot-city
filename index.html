 if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(...rep)}t.anisotropy=4;return t}

 const m=new THREE.MeshStandardMaterial({color:c,metalness:.9,roughness:.08,emissive:0xffffff,emissiveMap:t,emissiveIntensity:0,envMapIntensity:1.2});windows.push(m);return m};
